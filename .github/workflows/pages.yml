name: Validate and publish Aura Matrix Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check fixed lattice, import and backup contracts
        run: node --test tests/*.test.js
      - name: Check scripts
        run: |
          node --check demo-guide.js
          node --check vector-lab-ui.js
          node --check vector-lab-data.js
          node --check vector-lab-scene.js
          node --check vector-lab-worker.js
          node --check vector-lab-store.js
          node --check app.js
          node --check renderer.js
          node --check backup-data.js
          node --check data-transfer-ui.js
          node --check merch-ui.js
          node --check visit-history.js
          node --check extra-pages.js
          node --check frame-dialog.js
          node --check original.js
          node --check original-live.js
          node --check quickstart.js
          node --check original-sitemap.js
          node --check navigation-ui.js
          node --check navigation-tree.js
          node --check chakra-workspace.js
          node --check shell-style.js
          node --check menu-camera.js
          node --check original-favourites.js
          node --check market-map.js
          node --check travel-ui.js
          node --check celestial-clock.js
          node --check solar-system.js
          node --check time-context.js
          node --check timing-data.js
          node --check avatar-data.js
          node --check life-data.js
          node --check life-ui.js
          node --check local-tools.js
          node --check preferences-ui.js
          node --check palace-ui.js
          node --check palace-media.js
          node --check palace-capture-ui.js
          node --check chakra-art.js
          node --check attraction-data.js
          node --check connection-sharing.js
          node --check connection-inputs.js
          node --check dating-data.js
          node --check friendship-data.js
          node --check dating-ui.js
          node --check connection-flow.js
          node --check social-ui.js
          node --check affinity-ui.js
          node --check avatar-ui.js
          node --check measurement-ui.js
          node --check eye-photos.js
          node --check personal-space-data.js
          node --check personal-space-ui.js
          node --check timing-ui.js
          node --check timing-ideas.js
          node --check earth-map.js
          node --check earth-data.js
          python tools/test_market_filter.py
      - uses: actions/configure-pages@v5
      - name: Prepare public files only
        run: |
          mkdir -p _site/tools
          cp demo-guide.js demo-guide.css _site/
          cp vector-lab*.js vector-lab.css _site/
          cp frame-dialog.js backup-data.js data-transfer-ui.js merch-ui.js visit-history.js extra-pages.js _site/
          cp connection-flow.js navigation-ui.js chakra-workspace.js shell-style.js navigation-tree.js chakra-art.js palace-media.js palace-capture-ui.js attraction-data.js connection-sharing.js connection-inputs.js dating-data.js friendship-data.js dating-ui.js local-tools.js preferences-ui.js palace-ui.js social-ui.js affinity-ui.js life-data.js life-ui.js measurement-ui.js eye-photos.js personal-space-data.js personal-space-ui.js avatar-data.js avatar-ui.js earth-map.js earth-data.js timing-data.js timing-ui.js timing-ideas.js solar-system.js frame-display.js favourite-groups.js _site/
          cp page-icons.js market-map.js travel-data.js travel-ui.js celestial-clock.js time-context.js MARKET-DATA.md TRAVEL-AND-TIMING.md index.html matrix.html original.js original.css original-live.js original-routes.js original-sitemap.js menu-camera.js original-favourites.js favourites-data.js quickstart.js dataset-schema.js dataset-allocation.js DATASET-CATALOGUE.md inventory.html explainer.html guide.html styles.css core.js renderer.js app.js spatial.js spatial-ui.js workspace.js LICENCE.md .nojekyll _site/
          cp -r assets vendor _site/
          cp tools/blender_import.py _site/tools/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
