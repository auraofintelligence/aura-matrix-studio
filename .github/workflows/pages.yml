name: Validate and publish Aura Matrix Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check fixed lattice, import and backup contracts
        run: node --test tests/*.test.js
      - name: Check scripts
        run: |
          node --check app.js
          node --check renderer.js
          node --check original.js
          node --check original-live.js
          node --check quickstart.js
      - uses: actions/configure-pages@v5
      - name: Prepare public files only
        run: |
          mkdir -p _site/tools
          cp index.html matrix.html original.js original.css original-live.js original-routes.js quickstart.js dataset-schema.js dataset-allocation.js DATASET-CATALOGUE.md inventory.html explainer.html guide.html styles.css core.js renderer.js app.js spatial.js spatial-ui.js workspace.js LICENCE.md .nojekyll _site/
          cp -r assets vendor _site/
          cp tools/blender_import.py _site/tools/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
